<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vitor Bernardes - Nutricionista. Agende sua consulta e fale comigo." />
  <meta name="theme-color" content="#F5F1E8" />

  <title>Vitor Bernardes | Nutricionista</title>

  <style>
    :root {
      --bg: #f5f1e8;
      --card: rgba(255,255,255,.74);
      --text: #243127;
      --muted: #687268;
      --accent: #5e745f;
      --accent-dark: #435544;
      --line: rgba(36,49,39,.10);
      --shadow: 0 18px 60px rgba(36,49,39,.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(94,116,95,.13), transparent 34%),
        radial-gradient(circle at bottom right, rgba(190,169,132,.14), transparent 36%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 28px 18px;
    }

    .page {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 30px;
      padding: 34px 24px 26px;
      box-shadow: var(--shadow);
    }

    .avatar {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      margin: 0 auto 18px;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.9);
      box-shadow: 0 10px 30px rgba(36,49,39,.14);
      background: linear-gradient(135deg, #d7ddd2, #ece5d8);
      display: grid;
      place-items: center;
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 34px;
      letter-spacing: .04em;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.05;
      text-align: center;
      letter-spacing: -.035em;
    }

    .role {
      text-align: center;
      margin-top: 8px;
      font-size: 15px;
      color: var(--accent-dark);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .bio {
      text-align: center;
      margin: 16px auto 24px;
      max-width: 390px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      position: relative;
      min-height: 58px;
      width: 100%;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 44px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      border: 1px solid var(--line);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 10px 24px rgba(94,116,95,.24);
      border-color: transparent;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-secondary {
      background: rgba(255,255,255,.76);
      color: var(--text);
    }

    .icon {
      position: absolute;
      left: 18px;
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .mini {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mini a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }

    .mini a:hover {
      color: var(--accent-dark);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 24px 0 18px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(94,116,95,.08);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    @media (max-width: 420px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 28px 18px 22px;
        border-radius: 24px;
      }

      .btn {
        min-height: 56px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <!--
        FOTO:
        1) Coloque uma imagem chamada "foto-vitor.jpg" na mesma pasta deste arquivo.
        2) Troque o conteúdo abaixo por:
           <img src="foto-vitor.jpg" alt="Vitor Bernardes">
      -->
      <div class="avatar"><img src="foto-vitor.jpg" alt="Vitor Bernardes"></div>

      <h1>Vitor Bernardes</h1>
      <p class="role">Nutricionista</p>

      <p class="bio">
        Nutrição para quem treina, quer evoluir e busca resultados que vão além da estética.
      </p>

      <div class="buttons">
        <!-- TROQUE O NÚMERO 5527993128291 PELO WHATSAPP REAL -->
        <a
          class="btn btn-primary"
          href="https://wa.me/5527993128291?text=Olá%2C%20Vitor!%20Vim%20pelo%20Instagram%20e%20gostaria%20de%20saber%20mais%20sobre%20as%20consultas."
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">💬</span>
          Agende sua consulta
        </a>

        <!-- TROQUE @vitorbernardesnutri PELO PERFIL REAL, SE NECESSÁRIO -->
        <a
          class="btn btn-secondary"
          href="https://www.instagram.com/vitorbernardesnutri/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">◎</span>
          Instagram
        </a>

        <!-- TROQUE PELO LINK REAL DO GOOGLE MAPS / CONSULTÓRIO -->
        <a
          class="btn btn-secondary"
          href="https://www.google.com/maps/search/?api=1&query=Vit%C3%B3ria%2C%20ES"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon">⌖</span>
          Localização do consultório
        </a>

        <!-- OPCIONAL: troque pelo link de formulário, agenda, Doctoralia etc. -->
        <a
          class="btn btn-secondary"
          href="#"
          onclick="alert('Adicione aqui o link da sua agenda online.'); return false;"
        >
          <span class="icon">◷</span>
          Horários e atendimento
        </a>
      </div>

      <div class="mini">
        <a href="mailto:vitorbernardesnutri@gmail.com">E-mail</a>
        <a href="#" onclick="navigator.share ? navigator.share({title:'Vitor Bernardes | Nutricionista', url:location.href}) : navigator.clipboard.writeText(location.href); return false;">
          Compartilhar perfil
        </a>
      </div>

      <div class="divider"></div>

      <footer>
        <div>© <span id="year"></span> Vitor Bernardes • Nutricionista</div>
        <span class="tag">bio.vitorbernardesnutri.com.br</span>
      </footer>
    </section>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
